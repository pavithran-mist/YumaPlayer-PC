name: Build & Release Windows + Android

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build Windows Installer & Portable EXE
        run: npx electron-builder --win --publish never

      - name: Upload Windows Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml

  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate CI Signing Keystore
        run: |
          keytool -genkeypair -v -keystore "$GITHUB_WORKSPACE/android-app/release.keystore" -alias yuma -keyalg RSA -keysize 2048 -validity 10000 -storepass yumaplayer123 -keypass yumaplayer123 -dname "CN=Pavithran, OU=YumaPlayer, O=Pavithran, C=IN"

      - name: Build Signed Android APK
        working-directory: android-app
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android-app/release.keystore
          ANDROID_STORE_PASSWORD: yumaplayer123
          ANDROID_KEY_ALIAS: yuma
          ANDROID_KEY_PASSWORD: yumaplayer123
        run: gradle assembleRelease --no-daemon

      - name: Prepare Versioned APK
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p android-dist
          cp android-app/app/build/outputs/apk/release/app-release.apk "android-dist/YumaPlayer-Android-${VERSION}.apk"

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-dist
          path: android-dist/*.apk

  publish-release:
    needs: [build-windows, build-android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-dist
          path: release-assets

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: android-dist
          path: release-assets

      - name: Publish GitHub Release (PC EXE + Android APK)
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true

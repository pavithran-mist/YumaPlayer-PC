name: Build & Release Windows Installer

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build Windows Installer & Portable EXE
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ("${{ github.ref }}" -like "refs/tags/v*" -or "${{ github.event_name }}" -eq "workflow_dispatch") {
            npx electron-builder --win --publish always
          } else {
            npx electron-builder --win --publish never
          }

      - name: Upload Windows EXE Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: YumaPlayer-PC-Windows
          path: |
            dist/*.exe
            dist/latest.yml
          if-no-files-found: warn
